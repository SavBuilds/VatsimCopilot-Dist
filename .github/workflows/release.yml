# .github/workflows/release.yml
# Place this file in the VatsimCopilot-Dist repo (not the source repo).
#
# How to cut a release:
#   1. Build locally:  python build_release.py --installer --zip
#   2. Copy release\VATSIM_Copilot_Setup_vX.X.X.exe  →  VatsimCopilot-Dist\
#      Copy release\VATSIM_Copilot_vX.X.X.zip         →  VatsimCopilot-Dist\
#   3. git add . && git commit -m "vX.X.X"
#   4. git tag vX.X.X && git push && git push --tags
#
# GitHub Actions picks up the tag, creates the release, and attaches both files.
# The version check in telemetry.py reads the tag_name from the GitHub API
# automatically — nothing else to update.

name: Create Release

on:
  push:
    tags:
      - 'v[0-9]*'   # matches v0.2.3, v1.0.0, etc. — ignores test/draft tags

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to create releases and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect release assets
        id: assets
        run: |
          # Find installer and zip in the repo root
          FILES=$(ls *.exe *.zip 2>/dev/null | tr '\n' ' ')
          echo "Found assets: $FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"

          # Build the gh release create command.
          # --generate-notes  pulls bullet points from merged PRs / commits since last tag.
          # Append asset filenames as positional args (gh handles the upload).
          gh release create "$TAG" \
            --title "$TAG" \
            ${{ steps.assets.outputs.files }}

          echo "Release $TAG published."
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"
